<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Member Panel — AVYAKT</title>
<meta name="description" content="Member panel for AVYAKT — elite members manage events, news, projects, gallery and members.">
<meta name="theme-color" content="#0b2a5b">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/images/icon-192.png">
<link rel="apple-touch-icon" href="assets/images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=14">
<script>(function(){try{var t=localStorage.getItem('horizon-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body data-page="admin">
<header class="site-header" id="siteHeader"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Member Panel</div>
      <h1>Member Panel</h1>
      <p>Elite members manage everything shown on the website from here — events, news, projects, gallery and members.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- GATE -->
      <div id="adminGate" class="form-card" style="max-width:460px;margin:0 auto">
        <h2 style="margin-top:0">Member access</h2>
        <p class="muted small">Enter the club passcode to manage site content.</p>
        <div class="field">
          <label for="adminPass">Passcode</label>
          <input id="adminPass" type="password" placeholder="Enter passcode" autocomplete="current-password">
        </div>
        <button class="btn btn-blue btn-block" id="adminUnlock">Unlock panel</button>
        <div class="notice" id="adminGateNote" role="status"></div>
      </div>

      <!-- PANEL -->
      <div id="adminPanel" class="hidden">
        <div class="tabs" id="adminTabs"></div>
        <div id="adminBody"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<script src="assets/js/data.js?v=14"></script>
<script src="assets/js/store.js?v=14"></script>
<script src="assets/js/main.js?v=14"></script>
<script src="assets/js/admin.js?v=14"></script>
</body>
</html>
